model:
  model_path: /data1/hcy/cache/modelscope/hub/models/Robbyant/lingbot-vla-4b
  tokenizer_path: /data1/hcy/cache/huggingface/hub/models--Qwen--Qwen2.5-VL-3B-Instruct/snapshots/66285546d2b821cf421d4f5eb2576359d3770cd3

data:
  datasets_type: vla
  data_name: so101_bi
  train_path: /data1/hcy/lerobot-dataset/so101_bi_150
  joints:
    - arm.position: 12
    - effector.position: 2
  cameras:
    - camera_top
    - camera_wrist_left
    - camera_wrist_right
  num_workers: 8
  norm_type: meanstd
  norm_stats_file: assets/norm_stats/so101_bi.json

train:
  output_dir: "output/"
  data_parallel_mode: fsdp2
  enable_full_shard: false
  module_fsdp_enable: true
  use_compile: false
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: true
  # 方案:仅训练动作专家(VLM 完全冻结)。单卡 48GB 验证过:micro 8 x accum 16 = 全局 batch 128
  train_expert_only: true
  enable_lora: false   # LoRA 方案已停用(如需启用:true + lora_rank/alpha)
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 5.0e-5
  lr_decay_style: constant
  micro_batch_size: 8
  gradient_accumulation_steps: 16
  max_steps: 9400
  ckpt_manager: dcp
  save_steps: 1000
  save_epochs: 0
  enable_fp32: false   # Control the precision of the action expert
  enable_resume: true
