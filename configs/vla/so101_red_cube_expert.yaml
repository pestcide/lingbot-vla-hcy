model:
  # 基模:预训练 lingbot-vla-4b(非后训练检查点),只训练动作专家
  model_path: /data1/hcy/cache/modelscope/hub/models/Robbyant/lingbot-vla-4b
  tokenizer_path: /data1/hcy/cache/huggingface/hub/models--Qwen--Qwen2.5-VL-3B-Instruct/snapshots/66285546d2b821cf421d4f5eb2576359d3770cd3

data:
  datasets_type: vla
  data_name: so101_red_cube
  train_path: /data1/hcy/lerobot-dataset/so101_ubuntu_bimanual_red_cube
  joints:
    - arm.position: 12
    - effector.position: 2
  cameras:
    - camera_top
    - camera_wrist_left
    - camera_wrist_right
  num_workers: 8
  norm_type: meanstd
  norm_stats_file: assets/norm_stats/so101_red_cube.json

train:
  output_dir: "output/so101_red_cube_expert"   # 独立 run 目录
  data_parallel_mode: fsdp2
  enable_full_shard: false
  module_fsdp_enable: true
  use_compile: false
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: true
  # 方案:仅训练动作专家(VLM 完全冻结)。单卡 48GB 验证过:micro 8 x accum 16 = 全局 batch 128
  train_expert_only: true
  enable_lora: false   # LoRA 方案已停用(如需启用:true + lora_rank/alpha)
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 5.0e-5
  lr_decay_style: cosine      # 相比 constant,尾部退火避免震荡(so101_bi 经验)
  lr_warmup_ratio: 0.03
  micro_batch_size: 8
  gradient_accumulation_steps: 16   # 8 x 16 = 全局 batch 128
  max_steps: 5000             # 63085 帧 / batch128 ≈ 493 步/epoch → 5000 步 ≈ 10 epoch
  ckpt_manager: dcp
  save_steps: 1000
  save_epochs: 0
  enable_fp32: false   # Control the precision of the action expert
  enable_resume: true
