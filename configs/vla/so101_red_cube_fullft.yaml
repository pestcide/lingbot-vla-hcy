model:
  # 基模:预训练 lingbot-vla-4b(非后训练检查点),全量微调
  model_path: /data1/hcy/cache/modelscope/hub/models/Robbyant/lingbot-vla-4b
  tokenizer_path: /data1/hcy/cache/huggingface/hub/models--Qwen--Qwen2.5-VL-3B-Instruct/snapshots/66285546d2b821cf421d4f5eb2576359d3770cd3

data:
  datasets_type: vla
  data_name: so101_red_cube
  train_path: /data1/hcy/lerobot-dataset/so101_ubuntu_bimanual_red_cube
  joints:
    - arm.position: 12
    - effector.position: 2
  cameras:
    - camera_top
    - camera_wrist_left
    - camera_wrist_right
  num_workers: 8
  norm_type: meanstd
  norm_stats_file: assets/norm_stats/so101_red_cube.json

train:
  output_dir: "output/so101_red_cube_fullft"   # 独立 run 目录,避免覆盖旧 run 的检查点
  data_parallel_mode: fsdp2
  enable_full_shard: true      # 关键:FSDP 全分片,3 卡分摊参数/梯度/优化器状态(单卡全参必 OOM)
  module_fsdp_enable: true
  use_compile: false
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: false # 全量微调:不冻结任何模块
  # 全量微调方案(非 expert-only / 非 LoRA):所有参数参与训练
  train_expert_only: false
  enable_lora: false
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 2.0e-5                  # 全参训练保守 LR(此前 expert-only 用 5e-5)
  lr_decay_style: cosine
  lr_warmup_ratio: 0.03       # 从基模开始,加短 warmup 更稳
  micro_batch_size: 8         # 发烟实测 micro4 x accum32 = 350s/步太慢;升 micro 降 accum
  gradient_accumulation_steps: 8   # 8 x 8 = 全局 batch 64(显存若超 48GB 则回退 micro4 x accum8)
  max_steps: 5000             # 63085 帧 / batch128 ≈ 493 步/epoch → 5000 步 ≈ 10 epoch
  ckpt_manager: dcp
  save_steps: 1000
  save_epochs: 0
  enable_fp32: false          # 控制 action expert 精度;单卡/多卡 FSDP 均需 false
  enable_resume: true
